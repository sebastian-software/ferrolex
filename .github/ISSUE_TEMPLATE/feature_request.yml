name: Feature request
description: Propose a focused improvement to the ferrolex product or public API.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please check the [architecture overview](https://github.com/sebastian-software/ferrolex/blob/main/ARCHITECTURE.md) and current product boundaries before proposing a new integration or parser.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest focused behavior or API that would address the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing commands, APIs, or workflows did you consider?

  - type: textarea
    id: boundaries
    attributes:
      label: Product-boundary considerations
      description: Explain how this fits the current engine, dictionary, and integration support tiers.

  - type: checkboxes
    id: checks
    attributes:
      label: Triage checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I agree that any dictionary-content proposal must use repository-owned metadata and reviewed fixture evidence rather than committed third-party data.
          required: true

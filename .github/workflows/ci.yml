name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p ferrolex-ffi --features c-abi
      - run: cargo test -p ferrolex-lsp
      - run: cargo bench -p ferrolex-core --no-run
      - run: cargo bench -p ferrolex-compiler --no-run
      - run: cargo bench -p ferrolex-suggest --no-run
      - run: cargo bench -p ferrolex-hunspell --no-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE-APACHE
      - run: test -s LICENSE-MIT
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Feature coverage is configured in deny.toml; avoid action defaults
          # that are not accepted by current cargo-deny versions.
          arguments: ""

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in hunspell_import runtime_cache_loader compiled_loader suggestion_input compound_evaluation; do
            cargo +nightly fuzz run "$target" -- -runs=256
          done

  hunspell-compatibility-gate:
    name: Hunspell compatibility gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: changes
        name: Identify compatibility-relevant changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/|crates/|scripts/(fetch-compat-fixtures|generate-readme-compat-status)\.sh$|README\.md$|\.github/workflows/)' "$RUNNER_TEMP/changed-files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No executable, dependency, fixture, generator, README, or CI paths changed.'
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.changes.outputs.relevant == 'true'
        with:
          toolchain: 1.88
      - name: Run required compatibility fixtures
        if: steps.changes.outputs.relevant == 'true'
        run: >-
          scripts/fetch-compat-fixtures.sh --set required "$RUNNER_TEMP/ferrolex-compat-fixtures"
          && scripts/generate-readme-compat-status.sh --check
          &&
          FERROLEX_COMPAT_FIXTURES="$RUNNER_TEMP/ferrolex-compat-fixtures"
          FERROLEX_COMPAT_FIXTURE_SET=required
          cargo test -p ferrolex-hunspell --test real_world -- --nocapture

  compatibility-scorecard:
    name: Full Hunspell oracle scorecard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/hunspell-compatibility.yml
    secrets: inherit

  binding-spikes:
    name: Binding spikes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/bench-node-binding.sh
      - run: bash scripts/bench-python-binding.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix editors/vscode/ferrolex ci --ignore-scripts
      - run: npm --prefix editors/vscode/ferrolex test
      - run: npm --prefix editors/vscode/ferrolex run pack:check

  lsp-release-smoke:
    name: LSP release smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_format: tar.gz
            binary_suffix: ""
          - platform: Ubuntu x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            binary_suffix: ""
          - platform: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            binary_suffix: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p ferrolex-lsp --release --target ${{ matrix.target }}
      - run: >-
          python scripts/package-lsp-release.py
          --binary target/${{ matrix.target }}/release/ferrolex-lsp${{ matrix.binary_suffix }}
          --version 0.2.0
          --target ${{ matrix.target }}
          --out-dir ${{ runner.temp }}/ferrolex-lsp-release
          --format ${{ matrix.archive_format }}
      - run: >-
          python scripts/verify-lsp-release-artifact.py
          --artifact ${{ runner.temp }}/ferrolex-lsp-release/ferrolex-lsp-0.2.0-${{ matrix.target }}.${{ matrix.archive_format }}
          --version 0.2.0
          --target ${{ matrix.target }}
          --binary-name ferrolex-lsp${{ matrix.binary_suffix }}
      - run: >-
          python scripts/release-sha256sums.py
          --directory ${{ runner.temp }}/ferrolex-lsp-release
          --manifest ${{ runner.temp }}/ferrolex-lsp-release/SHA256SUMS
      - run: >-
          python scripts/release-sha256sums.py
          --verify
          --directory ${{ runner.temp }}/ferrolex-lsp-release
          --manifest ${{ runner.temp }}/ferrolex-lsp-release/SHA256SUMS
      - run: >-
          python scripts/lsp-stdio-smoke.py
          --artifact ${{ runner.temp }}/ferrolex-lsp-release/ferrolex-lsp-0.2.0-${{ matrix.target }}.${{ matrix.archive_format }}
          --binary-name ferrolex-lsp${{ matrix.binary_suffix }}

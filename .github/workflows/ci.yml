name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.81", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench -p ferrolex-core --no-run
      - run: cargo bench -p ferrolex-compiler --no-run
      - run: cargo bench -p ferrolex-suggest --no-run
      - run: cargo bench -p ferrolex-hunspell --no-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE-APACHE
      - run: test -s LICENSE-MIT
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Feature coverage is configured in deny.toml; avoid action defaults
          # that are not accepted by current cargo-deny versions.
          arguments: ""

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in hunspell_import runtime_cache_loader compiled_loader suggestion_input compound_evaluation; do
            cargo +nightly fuzz run "$target" -- -runs=256
          done

  compatibility:
    name: Compatibility fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81
      - run: sudo apt-get update && sudo apt-get install --yes hunspell
      - run: scripts/fetch-compat-fixtures.sh "$RUNNER_TEMP/ferrolex-compat-fixtures"
      - run: scripts/generate-readme-compat-status.sh --check
      - run: >-
          FERROLEX_COMPAT_FIXTURES="$RUNNER_TEMP/ferrolex-compat-fixtures"
          FERROLEX_COMPAT_ORACLE=hunspell
          FERROLEX_COMPAT_SCORECARD="$RUNNER_TEMP/recognition-scorecard.tsv"
          cargo test -p ferrolex-hunspell --test real_world -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: recognition-scorecard
          path: ${{ runner.temp }}/recognition-scorecard.tsv

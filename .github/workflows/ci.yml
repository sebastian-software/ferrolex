name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-version-contract:
    name: Release version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 scripts/check-release-version-contract.py
      - run: python3 scripts/publish-crates.py --check

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.88"
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test
      - run: cargo bench -p ferrolex-core --no-run
      - run: cargo bench -p ferrolex-compiler --no-run
      - run: cargo bench -p ferrolex-suggest --no-run
      - run: cargo bench -p ferrolex-hunspell --no-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE-APACHE
      - run: test -s LICENSE-MIT
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Feature coverage is configured in deny.toml; avoid action defaults
          # that are not accepted by current cargo-deny versions.
          arguments: ""

  suggestion-quality:
    name: Suggestion quality regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >-
          FERROLEX_SUGGESTION_QUALITY_REQUIRE_APPROVED=1
          cargo test -p ferrolex-suggest --test suggestion_quality -- --nocapture

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-fuzz
      - run: |
          host_target="$(rustc +nightly --version --verbose | sed -n 's/^host: //p')"
          for target in hunspell_import runtime_cache_loader compiled_loader suggestion_input compound_evaluation; do
            cargo +nightly fuzz run "$target" --target "$host_target" -- -runs=256
          done

  hunspell-compatibility-gate:
    name: Hunspell compatibility gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: changes
        name: Identify compatibility-relevant changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/|crates/|scripts/(fetch-compat-fixtures|generate-readme-compat-status)\.sh$|README\.md$|\.github/workflows/)' "$RUNNER_TEMP/changed-files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No executable, dependency, fixture, generator, README, or CI paths changed.'
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.changes.outputs.relevant == 'true'
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.relevant == 'true'
      - name: Run required compatibility fixtures
        if: steps.changes.outputs.relevant == 'true'
        run: >-
          scripts/fetch-compat-fixtures.sh --set required "$RUNNER_TEMP/ferrolex-compat-fixtures"
          && scripts/generate-readme-compat-status.sh --check
          &&
          FERROLEX_COMPAT_FIXTURES="$RUNNER_TEMP/ferrolex-compat-fixtures"
          FERROLEX_COMPAT_FIXTURE_SET=required
          cargo test -p ferrolex-hunspell --test real_world -- --nocapture

  compatibility-scorecard:
    name: Full Hunspell oracle scorecard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/hunspell-compatibility.yml
    secrets: inherit

  node-binding:
    name: Node binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/bench-node-binding.sh

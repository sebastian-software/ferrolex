name: Full Hunspell compatibility scorecard

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref whose compatibility evidence is being measured.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose compatibility evidence is being measured (defaults to this dispatch SHA).
        required: false
        type: string

permissions:
  contents: read

jobs:
  scorecard:
    name: Full Hunspell oracle scorecard
    runs-on: ubuntu-latest
    # CI run 31731673331 measured the preceding all-fixture scorecard in 107m10s.
    # The selected seven-locale set retains most of that input, so 150 minutes
    # leaves conservative diagnostic and artifact-upload headroom.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install --yes hunspell
      - run: scripts/fetch-compat-fixtures.sh --set scorecard "$RUNNER_TEMP/ferrolex-compat-fixtures"
      - run: scripts/generate-readme-compat-status.sh --check
      - run: >-
          FERROLEX_COMPAT_FIXTURES="$RUNNER_TEMP/ferrolex-compat-fixtures"
          FERROLEX_COMPAT_FIXTURE_SET=scorecard
          FERROLEX_COMPAT_ORACLE=hunspell
          FERROLEX_COMPAT_SCORECARD="$RUNNER_TEMP/recognition-scorecard.tsv"
          FERROLEX_COMPAT_SCORECARD_BASELINE="crates/ferrolex-hunspell/tests/real_world/scorecard-baseline.tsv"
          cargo test -p ferrolex-hunspell --test real_world -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recognition-scorecard
          path: ${{ runner.temp }}/recognition-scorecard.tsv
          if-no-files-found: error

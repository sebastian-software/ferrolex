[package]
name = "ferrolex"
version = "0.1.0"
description = "Modern Rust spell-checking engine with Hunspell-compatible dictionaries"
include = ["/src/**", "/Cargo.toml", "/CHANGELOG.md", "/LICENSE-*", "/README.md"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
ffi = ["dep:ferrolex-ffi", "ferrolex-ffi/c-abi"]

[dependencies]
ferrolex-core = { path = "crates/ferrolex-core", version = "0.1.0" }
ferrolex-ffi = { path = "crates/ferrolex-ffi", version = "0.1.0", optional = true }

[lints]
workspace = true

[workspace]
members = [
    "crates/ferrolex-core",
    "crates/ferrolex-text",
    "crates/ferrolex-code",
    "crates/ferrolex-hunspell",
    "crates/ferrolex-suggest",
    "crates/ferrolex-dictionaries",
    "crates/ferrolex-compiler",
    "crates/ferrolex-cli",
    "crates/ferrolex-ffi",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/ferrolex"
homepage = "https://github.com/sebastian-software/ferrolex"
keywords = ["spell-checking", "dictionary", "unicode"]
categories = ["text-processing"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "ferrolex"
version = "0.4.0"
description = "Modern Rust spell-checking engine with Hunspell-compatible dictionaries"
include = ["/src/**", "/Cargo.toml", "/CHANGELOG.md", "/LICENSE-*", "/README.md"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ferrolex-core = { path = "crates/ferrolex-core", version = "0.4.0" }
ferrolex-dictionaries = { path = "crates/ferrolex-dictionaries", version = "0.4.0" }
ferrolex-hunspell = { path = "crates/ferrolex-hunspell", version = "0.4.0" }
ferrolex-suggest = { path = "crates/ferrolex-suggest", version = "0.4.0" }

[lints]
workspace = true

[workspace]
members = [
    "crates/ferrolex-core",
    "crates/ferrolex-text",
    "crates/ferrolex-code",
    "crates/ferrolex-hunspell",
    "crates/ferrolex-suggest",
    "crates/ferrolex-dictionaries",
    "crates/ferrolex-compiler",
    "crates/ferrolex-cli",
    "crates/ferrolex-ffi",
    "crates/ferrolex-node",
    "crates/ferrolex-python",
    "crates/ferrolex-lsp",
]
default-members = [
    ".",
    "crates/ferrolex-core",
    "crates/ferrolex-text",
    "crates/ferrolex-code",
    "crates/ferrolex-hunspell",
    "crates/ferrolex-suggest",
    "crates/ferrolex-dictionaries",
    "crates/ferrolex-compiler",
    "crates/ferrolex-cli",
    "crates/ferrolex-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian-software/ferrolex"
homepage = "https://github.com/sebastian-software/ferrolex"
keywords = ["spell-checking", "dictionary", "unicode"]
categories = ["text-processing"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

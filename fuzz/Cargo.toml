[package]
name = "ferrolex-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrolex-compiler = { path = "../crates/ferrolex-compiler" }
ferrolex-code = { path = "../crates/ferrolex-code" }
ferrolex-core = { path = "../crates/ferrolex-core" }
ferrolex-hunspell = { path = "../crates/ferrolex-hunspell" }
ferrolex-suggest = { path = "../crates/ferrolex-suggest" }

# Keep fuzzing tooling and its nightly-only dependency graph out of the shipped
# workspace and its MSRV contract.
[workspace]
members = ["."]

[[bin]]
name = "hunspell_import"
path = "fuzz_targets/hunspell_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime_cache_loader"
path = "fuzz_targets/runtime_cache_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiled_loader"
path = "fuzz_targets/compiled_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "suggestion_input"
path = "fuzz_targets/suggestion_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compound_evaluation"
path = "fuzz_targets/compound_evaluation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyze_source"
path = "fuzz_targets/analyze_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_config"
path = "fuzz_targets/project_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "word_list"
path = "fuzz_targets/word_list.rs"
test = false
doc = false
bench = false

[package]
name = "ferrolex-lsp"
version = "0.1.0"
description = "Generic stdio language server for ferrolex"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "ferrolex-lsp"
path = "src/main.rs"

[dependencies]
ferrolex-code = { path = "../ferrolex-code", version = "0.1.0" }
ferrolex-core = { path = "../ferrolex-core", version = "0.1.0" }
ferrolex-suggest = { path = "../ferrolex-suggest", version = "0.1.0" }
lsp-server = "=0.8.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[lints]
workspace = true

[package]
name = "ferrolex-compiler"
version = "0.4.0"
description = "Supporting compiled dictionary format for ferrolex"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["spell-checking", "dictionary", "compiled-format", "storage"]
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
ferrolex-core = { path = "../ferrolex-core", version = "0.4.0" }
ferrolex-suggest = { path = "../ferrolex-suggest", version = "0.4.0" }

[dev-dependencies]
criterion = "0.5.1"
fst = "0.4.7"
proptest = "=1.6.0"

[lints]
workspace = true

[[bench]]
name = "dictionary"
harness = false

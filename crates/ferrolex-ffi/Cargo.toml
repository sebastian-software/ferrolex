[package]
name = "ferrolex-ffi"
version = "0.4.0"
description = "Experimental C ABI spike for ferrolex"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrolex-ffi"
keywords = ["spell-checking", "c-abi", "ferramenta"]
categories.workspace = true
readme = "README.md"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
c-abi = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
ferrolex-core.workspace = true
ferrolex-suggest.workspace = true

[build-dependencies]
cbindgen.workspace = true

[lints]
workspace = true

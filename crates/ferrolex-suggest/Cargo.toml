[package]
name = "ferrolex-suggest"
version = "0.5.0"
description = "Deterministic spelling suggestions for ferrolex"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrolex-suggest"
keywords = ["spell-checking", "suggestions", "correction", "unicode", "ferramenta"]
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
exclude = ["/tests/**"]

[dependencies]
ferrolex-core.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "suggestions"
harness = false

[lints]
workspace = true

[package]
name = "ferrolex-node"
version = "0.5.0"
description = "Node.js binding for the ferrolex spell-checking engine"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrolex-node"
keywords = ["spell-checking", "nodejs", "ferramenta"]
categories.workspace = true
readme = "README.md"
build = "build.rs"
publish = false

[lib]
